<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="theme-color" content="#111114">
<title>説明動画</title>
<style>
  :root {
    --blue: #3b5bdb; --ink: #1c1c1e; --sub: #6e6e73; --line: #e5e5ea; --chip: #f2f2f5; --bg: #ffffff; --stage: #111114;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
  .wrap { max-width: 1000px; margin: 0 auto; }
  @media (min-width: 900px) { body { background: #f4f4f6; } .wrap { padding: 28px 20px 48px; } .card { border-radius: 16px; overflow: hidden; background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,.06); } }

  /* ---------- 動画 ---------- */
  .stage { position: relative; width: 100%; aspect-ratio: 16 / 9; background: var(--stage); overflow: hidden; }
  .stage video, .stage iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: var(--stage); object-fit: contain; }
  .poster { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: brightness(.82); }
  .cover { position: absolute; inset: 0; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .bigplay { width: 84px; height: 84px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center;
    box-shadow: 0 8px 28px rgba(0,0,0,.35); transition: transform .15s; }
  .cover:active .bigplay { transform: scale(.94); }
  .bigplay::after { content: ""; margin-left: 8px; border-style: solid; border-width: 17px 0 17px 28px; border-color: transparent transparent transparent #fff; }
  .pill { position: absolute; top: 12px; left: 12px; display: flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 999px;
    background: rgba(28,28,30,.72); color: #fff; font-size: 15px; font-weight: 600; border: 0; cursor: pointer; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .pill .dur { font-weight: 400; opacity: .9; }
  .fs { position: absolute; top: 12px; right: 12px; width: 44px; height: 40px; border-radius: 12px; border: 0; cursor: pointer;
    background: rgba(28,28,30,.72); color: #fff; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  .fs svg { width: 20px; height: 20px; }
  /* YouTube のような操作（動画の上に重ねる）：上に題名、真ん中に 10秒戻る・再生/一時停止・10秒進む、下に時間・速さ・全画面とシークバー */
  .ctrl { position: absolute; inset: 0; z-index: 2; color: #fff; background: rgba(0,0,0,.38); transition: opacity .25s; }
  .ctitle { display: none; position: absolute; left: 16px; right: 16px; top: 12px; font-size: 17px; font-weight: 700; line-height: 1.35;
    text-shadow: 0 1px 4px rgba(0,0,0,.6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  body.rot .ctitle { display: block; }
  .cmid { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 34px; }
  .round { display: flex; align-items: center; justify-content: center; border: 0; border-radius: 50%; background: rgba(0,0,0,.42); color: #fff; cursor: pointer; padding: 0; }
  .round.lg { width: 62px; height: 62px; } .round.lg svg { width: 30px; height: 30px; }
  .round.sm { width: 46px; height: 46px; } .round.sm svg { width: 26px; height: 26px; }
  .cbot { position: absolute; left: 12px; right: 12px; bottom: 2px; }
  .crow { display: flex; align-items: center; gap: 8px; }
  .crow .gap { flex: 1; }
  .tpill { padding: 4px 11px; border-radius: 999px; background: rgba(0,0,0,.5); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .pillbtn { padding: 5px 12px; border: 0; border-radius: 999px; background: rgba(0,0,0,.5); color: #fff; font: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
  .crow .round.sm { width: 38px; height: 38px; background: rgba(0,0,0,.5); } .crow .round.sm svg { width: 20px; height: 20px; }
  .bar { position: relative; height: 22px; display: flex; align-items: center; cursor: pointer; touch-action: none; }
  .bar .track, .bar .buf, .bar .done { position: absolute; left: 0; height: 4px; border-radius: 2px; }
  .bar .track { right: 0; background: rgba(255,255,255,.35); }
  .bar .buf { background: rgba(255,255,255,.55); width: 0; }
  .bar .done { background: var(--blue); width: 0; }
  .bar .knob { position: absolute; left: 0; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--blue); box-shadow: 0 0 0 2px #fff; }
  .stage.hide-ui .ctrl, .stage.hide-ui .exitfs, .stage.hide-ui .pill, .stage.hide-ui .fs { opacity: 0; pointer-events: none; }
  .stage.hide-ui { cursor: none; }
  .stage.playing-ui .pill, .stage.playing-ui .fs { display: none; }
  .spin { position: absolute; left: 50%; top: 50%; width: 46px; height: 46px; margin: -23px 0 0 -23px; border-radius: 50%;
    border: 4px solid rgba(255,255,255,.28); border-top-color: #fff; animation: spin .9s linear infinite; pointer-events: none; z-index: 1; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .stage.drive .exitfs { right: auto; left: 12px; }
  .hint { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 4; max-width: 86%; padding: 14px 18px; border-radius: 14px;
    background: rgba(20,20,22,.86); color: #fff; font-size: 15px; line-height: 1.6; text-align: center; pointer-events: none; transition: opacity .4s; }
  .hint b { color: #9db4ff; }
  .wait { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
    background: rgba(28,28,30,.78); color: #fff; font-size: 13px; white-space: nowrap; }

  /* ---------- 下の情報 ---------- */
  .info { padding: 18px 16px 28px; }
  .who { display: flex; align-items: center; gap: 12px; }
  .avatar { width: 44px; height: 44px; border-radius: 50%; background: var(--ink); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 18px; flex: none; }
  .who b { display: block; font-size: 17px; }
  .who span { color: var(--sub); font-size: 14px; }
  h1 { font-size: 22px; line-height: 1.4; margin: 16px 0 6px; word-break: break-word; }
  .access { color: var(--sub); font-size: 14px; margin: 0 0 16px; }
  .actions { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
  .actions::-webkit-scrollbar { display: none; }
  .actions button { flex: none; display: flex; align-items: center; gap: 7px; padding: 10px 16px; border-radius: 999px; border: 0;
    background: var(--chip); color: var(--ink); font: inherit; font-size: 15px; cursor: pointer; }
  .actions button svg { width: 18px; height: 18px; }
  .speeds { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  .speeds button { padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line); background: #fff; font: inherit; font-size: 14px; cursor: pointer; color: var(--ink); }
  .speeds button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
  .sec { margin-top: 24px; }
  .sec h2 { font-size: 17px; margin: 0 0 8px; }
  .sec p.sum { margin: 0; line-height: 1.75; }
  .tr { margin-top: 8px; border: 1px solid var(--line); border-radius: 14px; max-height: 420px; overflow: auto; }
  .tr button { display: flex; gap: 12px; width: 100%; text-align: left; padding: 10px 14px; border: 0; border-top: 1px solid var(--line); background: #fff; font: inherit; font-size: 15px; color: var(--ink); cursor: pointer; line-height: 1.6; }
  .tr button:first-child { border-top: 0; }
  .tr button:hover, .tr button.now { background: #eef2ff; }
  .tr .ts { flex: none; color: var(--blue); font-variant-numeric: tabular-nums; font-size: 14px; padding-top: 1px; min-width: 42px; }
  .more { margin-top: 8px; border: 0; background: none; color: var(--blue); font: inherit; font-size: 14px; cursor: pointer; padding: 4px 0; }
  .help { margin-top: 22px; font-size: 13px; color: var(--sub); }
  .help a { color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: #fff; padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.on { opacity: 1; }
  [hidden] { display: none !important; }

  /* ---------- スマホを横に向けたら、動画を画面いっぱいに ---------- */
  @media (orientation: landscape) and (max-height: 540px) and (pointer: coarse) {
    html, body { background: #000; }
    body { min-height: calc(100vh + 120px); } /* 少し上にスワイプできる分の余白。Safari の上下のバーが縮む */
    .wrap { padding: 0 !important; max-width: none; }
    .card { box-shadow: none !important; border-radius: 0 !important; background: #000 !important; }
    .stage { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; aspect-ratio: auto; z-index: 10; background: #000; }
    .stage video, .stage iframe { background: #000; }
    .pill { top: max(10px, env(safe-area-inset-top)); left: max(12px, env(safe-area-inset-left)); }
    .fs { display: none; }
    .info { display: none; }
    #cfs { display: none; } /* 本当に横にしている時は、縦に戻せば元に戻る */
    .ctitle { display: block; }
  }

  /* ---------- 全画面ボタン（スマホ）：ページの中で動画を横向きに広げる ----------
     Discord・LINE などのアプリの中で開くと、スマホを横にしても画面が回らないことがある。
     そのため、縦のままでも動画を90度回して画面いっぱいに出す。本当に横に向けた時は上の CSS が受け持つ。 */
  .exitfs { display: none; position: absolute; top: 12px; right: 12px; z-index: 3; height: 40px; padding: 0 14px; border-radius: 12px; border: 0; cursor: pointer;
    background: rgba(28,28,30,.72); color: #fff; font: inherit; font-size: 15px; align-items: center; gap: 6px; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  body.rot { overflow: hidden; background: #000; }
  body.rot .info { display: none; }
  body.rot .fs { display: none; }
  body.rot .exitfs { display: flex; }
  body.rot .stage.playing-ui .exitfs { display: none; } /* 自前の操作バーの「縮小」で戻る */
  @media (orientation: portrait) {
    body.rot .stage { position: fixed; top: 0; left: 100vw; width: 100vh; width: 100dvh; height: 100vw; aspect-ratio: auto;
      transform-origin: top left; transform: rotate(90deg) translateZ(0); will-change: transform; z-index: 20; background: #000; }
    body.rot .stage video { background: #000; }
  }
</style>
</head>
<body>
<div class="wrap">
 <div class="card">
  <div class="stage" id="stage">
    <video id="video" playsinline preload="metadata"></video>
    <iframe id="frame" allow="autoplay; fullscreen" allowfullscreen title="説明動画" hidden></iframe>
    <img class="poster" id="poster" alt="" hidden>
    <button class="cover" id="cover" aria-label="再生する"><span class="bigplay"></span></button>
    <button class="pill" id="pill" aria-label="再生速度を変える"><span id="pillSpeed">1x</span><span class="dur" id="pillDur"></span></button>
    <button class="fs" id="fs" aria-label="全画面で見る">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>
    </button>
    <button class="exitfs" id="exitfs" aria-label="全画面をやめる">✕ 閉じる</button>
    <div class="spin" id="spin" hidden></div>
    <div class="hint" id="hint" hidden></div>
    <div class="ctrl" id="ctrl" hidden>
      <div class="ctitle" id="ctitle"></div>
      <div class="cmid">
        <button class="round sm" id="cback" aria-label="10秒戻る"></button>
        <button class="round lg" id="cplay" aria-label="再生・一時停止"></button>
        <button class="round sm" id="cfwd" aria-label="10秒進む"></button>
      </div>
      <div class="cbot">
        <div class="crow">
          <span class="tpill" id="ctime">0:00 / 0:00</span>
          <span class="gap"></span>
          <button class="pillbtn" id="cspeed" aria-label="再生速度を変える">1x</button>
          <button class="round sm" id="cfs" aria-label="全画面"></button>
        </div>
        <div class="bar" id="bar"><div class="track"></div><div class="buf" id="buf"></div><div class="done" id="done"></div><div class="knob" id="knob"></div></div>
      </div>
    </div>
    <div class="wait" id="wait" hidden>動画を準備しています…（数秒〜1分ほどで始まります）</div>
  </div>

  <div class="info">
    <div class="who">
      <div class="avatar">ヒ</div>
      <div><b>ヒラ</b><span id="when"></span><span id="views"></span></div>
    </div>
    <h1 id="title">説明動画</h1>
    <p class="access">リンクを知っている人が見られます</p>
    <div class="actions">
      <button id="copy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg>リンクをコピー</button>
      <button id="share" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 3v12M7 8l5-5 5 5M5 13v6a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-6"/></svg>共有</button>
    </div>
    <div class="speeds" id="speeds"></div>
    <div class="sec" id="sumSec" hidden><h2>要約</h2><p class="sum" id="sum"></p></div>
    <div class="sec" id="trSec" hidden>
      <h2>文字起こし</h2>
      <div class="tr" id="tr"></div>
      <button class="more" id="more" hidden>すべて表示</button>
    </div>
    <p class="help"><a id="driveLink" href="#">うまく見られないときはこちら</a></p>
  </div>
 </div>
</div>
<div class="toast" id="toast"></div>

<script>
  // リンクの # のあとにある Googleドライブの動画IDを読んで、動画ファイルをそのまま再生する。
  // ドライブの「再生処理」を待たないので、録り終わってすぐ見られる。うまくいかない時だけドライブの再生画面に切り替える。
  var KEY = "AIzaSyAgyNiDL5sNl-UXOo5W9kNPvXrwln3R8OQ"; // hira-juku.github.io からのドライブ読み込み専用に制限したキー
  var API = "https://www.googleapis.com/drive/v3/files/";
  var SIDE = "1QtXIoi0XBtKaEcVR--EaC4sW9-KGvMfB";
  var VIEWS = "https://script.google.com/macros/s/AKfycbx9XVSy53mwsJ4K5ufrB4Q07DcTWo6mkafs2GcBoDsLimSNAXvsHTpwwsAcMeWWxxxkJg/exec"; // 視聴数を数える Apps Script（ヒラさんのスプレッドシート「ヒラ録画_視聴記録」） // ドライブの「_文字起こし」フォルダ（録ったあと自動で文字起こしが置かれる）
  var id = (location.hash.slice(1).split("&")[0] || "").replace(/[^\w-]/g, "");
  var $ = function (x) { return document.getElementById(x); };
  var video = $("video"), frame = $("frame"), cover = $("cover"), poster = $("poster");
  var SRC = API + id + "?alt=media&key=" + KEY;
  var SPEEDS = [1, 1.25, 1.5, 1.75, 2];
  var speed = 1, switched = false, retries = 0, started = false, watchdog = 0;
  var startAt = Number((location.hash.match(/[&?]t=(\d+)/) || [])[1] || 0);
  try { speed = Number(localStorage.getItem("hira-speed")) || 1; } catch (e) {}
  // 視聴数：ヒラさん本人が一覧ページから開いた端末（&me=1）は数えない。生徒は名前のない乱数で「同じ端末は1人」と数える
  var owner = false, viewer = "";
  try {
    if (/[&?]me=1/.test(location.hash)) { localStorage.setItem("hira-owner", "1"); history.replaceState(null, "", location.href.replace(/&me=1/, "")); }
    owner = localStorage.getItem("hira-owner") === "1";
    viewer = localStorage.getItem("hira-viewer") || "";
    if (!viewer) { viewer = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("hira-viewer", viewer); }
  } catch (e) { viewer = Math.random().toString(36).slice(2) + Date.now().toString(36); }
  function showViews(n) { if (n > 0) $("views").textContent = "・" + n + "人が視聴"; }
  var counted = false;
  function countView() {
    if (counted || owner || !id) return;
    counted = true;
    var dev = /iPhone|iPad|Android|Mobile/i.test(navigator.userAgent) ? "mobile" : "pc";
    fetch(VIEWS, { method: "POST", body: JSON.stringify({ id: id, v: viewer, dev: dev }) })
      .then(function (r) { return r.json(); }).then(function (d) { if (d && d.viewers) showViews(d.viewers); }).catch(function () {});
  }

  function toast(t) { var el = $("toast"); el.textContent = t; el.classList.add("on"); setTimeout(function () { el.classList.remove("on"); }, 1600); }
  function fmtDur(sec) {
    if (!sec || !isFinite(sec)) return "";
    var m = Math.floor(sec / 60), s = Math.round(sec % 60);
    return m ? (m + "分" + (m < 10 && s ? s + "秒" : "")) : (s + "秒");
  }
  function ago(iso) {
    var d = (Date.now() - new Date(iso).getTime()) / 1000;
    if (!isFinite(d)) return "";
    if (d < 60) return "たった今";
    if (d < 3600) return Math.floor(d / 60) + "分前";
    if (d < 86400) return Math.floor(d / 3600) + "時間前";
    if (d < 86400 * 30) return Math.floor(d / 86400) + "日前";
    var t = new Date(iso); return (t.getMonth() + 1) + "月" + t.getDate() + "日";
  }
  function setSpeed(v) {
    speed = v; video.playbackRate = v;
    $("pillSpeed").textContent = (v === 1 ? "1" : v) + "x";
    $("cspeed").textContent = (v === 1 ? "1" : v) + "x";
    [].forEach.call($("speeds").children, function (b) { b.classList.toggle("on", Number(b.dataset.v) === v); });
    try { localStorage.setItem("hira-speed", String(v)); } catch (e) {}
  }
  function setDur(sec) { var t = fmtDur(sec); $("pillDur").textContent = t ? "・" + t : ""; }

  function useDrivePlayer() {
    if (switched) return;
    switched = true; clearTimeout(watchdog);
    video.pause(); video.removeAttribute("src"); video.load(); video.hidden = true;
    cover.hidden = true; poster.hidden = true; $("pill").hidden = true; $("wait").hidden = true;
    $("ctrl").hidden = true; $("spin").hidden = true;
    var st = $("stage"); st.classList.add("drive"); st.classList.remove("playing-ui", "hide-ui");
    document.body.classList.remove("rot"); $("fs").hidden = true; $("hint").hidden = true;
    frame.src = "https://drive.google.com/file/d/" + id + "/preview";
    frame.hidden = false;
    countView(); // ドライブの再生画面に切り替えた時は、中の再生を見られないので、切り替えた時点で1回と数える
    $("speeds").hidden = true;
  }
  function startWatch() {
    clearTimeout(watchdog);
    watchdog = setTimeout(function () { if (!switched && !retries && video.readyState < 2) useDrivePlayer(); }, 12000);
  }
  function retryLater() {
    retries++;
    $("wait").hidden = false;
    setTimeout(function () {
      video.src = SRC + "&r=" + retries;
      if (started) { var p = video.play(); if (p && p.catch) p.catch(function (e) { if (e && e.name === "NotAllowedError") cover.hidden = false; }); }
    }, 3000);
  }
  function begin() {
    started = true;
    cover.hidden = true; poster.hidden = true;
    $("ctrl").hidden = false; $("stage").classList.add("playing-ui");
    video.playbackRate = speed;
    startWatch();
    if (startAt) { try { video.currentTime = startAt; } catch (e) {} startAt = 0; }
    var p = video.play();
    if (p && p.catch) p.catch(function (e) {
      if (e && e.name === "NotAllowedError") { clearTimeout(watchdog); cover.hidden = false; return; }
      if (!e || e.name !== "AbortError") useDrivePlayer();
    });
  }

  // ---------- 自前の操作バー ----------
  var ICON = {
    play: '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13a1 1 0 0 0 1.5.86l10.4-6.5a1 1 0 0 0 0-1.72L9.5 4.64A1 1 0 0 0 8 5.5z"/></svg>',
    pause: '<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4.2" height="14" rx="1.2"/><rect x="13.8" y="5" width="4.2" height="14" rx="1.2"/></svg>',
    expand: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4"/></svg>',
    back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12a8 8 0 1 0 2.4-5.7"/><path d="M4 4v4h4"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system,sans-serif">10</text></svg>',
    fwd: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.4-5.7"/><path d="M20 4v4h-4"/><text x="12" y="15.6" text-anchor="middle" font-size="7.5" font-weight="700" fill="currentColor" stroke="none" font-family="-apple-system,sans-serif">10</text></svg>',
    shrink: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 4v4a1 1 0 0 1-1 1H4M15 4v4a1 1 0 0 0 1 1h4M9 20v-4a1 1 0 0 0-1-1H4M15 20v-4a1 1 0 0 1 1-1h4"/></svg>'
  };
  function clock(sec) {
    sec = Math.max(0, Math.floor(sec || 0));
    var h = Math.floor(sec / 3600), m = Math.floor(sec % 3600 / 60), x = sec % 60;
    return (h ? h + ":" + (m < 10 ? "0" : "") : "") + m + ":" + (x < 10 ? "0" : "") + x;
  }
  function isFull() { return document.body.classList.contains("rot") || !!document.fullscreenElement; }
  function paintCtrl() {
    var d = video.duration, t = video.currentTime;
    var ok = d && isFinite(d);
    var pct = ok ? Math.min(100, t / d * 100) : 0;
    $("done").style.width = pct + "%"; $("knob").style.left = pct + "%";
    if (ok && video.buffered.length) $("buf").style.width = Math.min(100, video.buffered.end(video.buffered.length - 1) / d * 100) + "%";
    $("ctime").textContent = clock(t) + " / " + (ok ? clock(d) : "--:--");
    $("cplay").innerHTML = video.paused ? ICON.play : ICON.pause;
    if (!$("cback").innerHTML) { $("cback").innerHTML = ICON.back; $("cfwd").innerHTML = ICON.fwd; }
    $("ctitle").textContent = $("title").textContent;
    $("cfs").innerHTML = isFull() ? ICON.shrink : ICON.expand;
  }
  var hideTimer = 0;
  // 再生中は、操作バー・時間・速さ・全画面ボタンなどを隠して動画だけにする。タップした時だけ少し出す
  function hideSoon(ms) {
    clearTimeout(hideTimer);
    hideTimer = setTimeout(function () {
      if (video.paused) return;
      if (dragging) return hideSoon(800);
      $("stage").classList.add("hide-ui");
    }, ms);
  }
  function showUi() {
    $("stage").classList.remove("hide-ui");
    hideSoon(2200);
  }
  function togglePlay() {
    if (video.paused) { var p = video.play(); if (p && p.catch) p.catch(function () {}); } else video.pause();
  }
  var dragging = false;
  function seekFromPoint(e) {
    var r = $("bar").getBoundingClientRect();
    // ページの中で90度回している時は、画面の縦方向がシークバーの向きになる
    var portraitRot = document.body.classList.contains("rot") && window.matchMedia("(orientation: portrait)").matches;
    var f = portraitRot ? (e.clientY - r.top) / r.height : (e.clientX - r.left) / r.width;
    f = Math.max(0, Math.min(1, f));
    if (video.duration && isFinite(video.duration)) { video.currentTime = f * video.duration; paintCtrl(); }
  }
  // iPhone の全画面プレーヤーは、Discord などアプリの中で開くと横に回らない（見分けもつかない）。
  // そのため iPhone ではページの中で90度回す。Safari で開いてスマホを横にすれば、ページごと横になって画面いっぱいになる
  var IPHONE = /iPhone|iPod/.test(navigator.userAgent);
  var hinted = false;
  function enterRot() {
    document.body.classList.add("rot"); window.scrollTo(0, 0);
    if (typeof paintCtrl === "function") setTimeout(paintCtrl, 0);
    // iPhone で Discord などのアプリの中から開くと、画面が回らず上下のバーも消せない。Safari で開けば Loom と同じ全画面になる
    if (!hinted && IPHONE) {
      hinted = true;
      var h = $("hint");
      h.innerHTML = "スマホを<b>横に向ける</b>と画面いっぱいになります<br>回らないときは、右下の <b>🧭（Safariで開く）</b><br>から開いてください";
      h.hidden = false; h.style.opacity = "1";
      setTimeout(function () { h.style.opacity = "0"; setTimeout(function () { h.hidden = true; }, 450); }, 4500);
    }
  }
  function exitRot() {
    document.body.classList.remove("rot");
    setTimeout(paintCtrl, 0);
    if (document.fullscreenElement) { try { document.exitFullscreen().catch(function () {}); } catch (e) {} }
  }
  function fullscreen() {
    if (switched) {
      // ドライブの再生画面のとき：スマホはページの中で横向きに広げる（アプリの中のブラウザでは本物の全画面が使えないため）
      if (window.matchMedia("(pointer: coarse)").matches) return; // 回すとドライブの操作がおかしくなるので、スマホでは何もしない
      if (frame.requestFullscreen) frame.requestFullscreen();
      return;
    }
    if (!started) begin();
    var st = $("stage");
    if (window.matchMedia("(pointer: coarse)").matches) {
      // スマホ：Android の Chrome なら本物の全画面＋横向きを試す。だめな時と iPhone は、ページの中で横向きに広げる
      if (document.fullscreenEnabled && st.requestFullscreen) {
        st.requestFullscreen()
          .then(function () { return screen.orientation.lock("landscape"); })
          .catch(function () {
            if (document.fullscreenElement) { try { document.exitFullscreen().catch(function () {}); } catch (e) {} }
            enterRot();
          });
      } else {
        enterRot();
      }
      return;
    }
    if (video.webkitEnterFullscreen && !document.fullscreenEnabled) { try { video.webkitEnterFullscreen(); } catch (e) {} return; } // iPhone
    var req = st.requestFullscreen || st.webkitRequestFullscreen;
    if (req) {
      var r = req.call(st);
      var lock = function () { try { screen.orientation.lock("landscape").catch(function () {}); } catch (e) {} };
      if (r && r.then) r.then(lock).catch(function () {}); else lock();
    } else if (video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); } catch (e) {} }
  }

  if (!id) {
    $("title").textContent = "動画のリンクが正しくありません";
    $("stage").hidden = true;
  } else {
    $("driveLink").href = "https://drive.google.com/file/d/" + id + "/view";
    $("driveLink").onclick = function (e) {
      if (switched) return; // もう切り替えてあれば、ドライブのページを開く
      e.preventDefault();
      useDrivePlayer();
      $("driveLink").textContent = "Googleドライブのページで開く";
      window.scrollTo(0, 0);
    };
    // 速度ボタン
    SPEEDS.forEach(function (v) {
      var b = document.createElement("button"); b.dataset.v = v; b.textContent = (v === 1 ? "1" : v) + "倍";
      b.onclick = function () { setSpeed(v); toast((v === 1 ? "ふつうの速さ" : v + "倍速") + "にしました"); };
      $("speeds").append(b);
    });
    setSpeed(speed);
    $("pill").onclick = function () { var i = SPEEDS.indexOf(speed); setSpeed(SPEEDS[(i + 1) % SPEEDS.length]); toast(speed + "倍速"); };
    // 最初の一コマを見せる（ドライブのサムネイルが無い間の代わり）
    video.src = SRC + "#t=0.5";
    (function probe() {
      var done = false;
      var t = setTimeout(function () { if (!done && !switched && video.readyState < 2) { done = true; useDrivePlayer(); } }, 8000);
      fetch(SRC + "&probe=1", { headers: { Range: "bytes=0-1" } })
        .then(function (r) { if (r.status !== 206 && r.status !== 200) throw new Error(String(r.status)); return r.arrayBuffer(); })
        .then(function () { done = true; clearTimeout(t); }) // 読めた（届ききる前の仮ファイルなら、動画のエラーの方で待って読み直す）
        .catch(function () { if (done) return; done = true; clearTimeout(t); if (!switched && video.readyState < 2) useDrivePlayer(); });
    })();
    cover.onclick = function () { if (started) { cover.hidden = true; togglePlay(); } else begin(); };
    $("cplay").onclick = function (e) { e.stopPropagation(); togglePlay(); showUi(); };
    var skip = function (sec) { if (video.duration && isFinite(video.duration)) video.currentTime = Math.max(0, Math.min(video.duration - 0.3, video.currentTime + sec)); paintCtrl(); showUi(); };
    $("cback").onclick = function (e) { e.stopPropagation(); skip(-10); };
    $("cfwd").onclick = function (e) { e.stopPropagation(); skip(10); };
    $("cspeed").onclick = function (e) { e.stopPropagation(); var i = SPEEDS.indexOf(speed); setSpeed(SPEEDS[(i + 1) % SPEEDS.length]); toast(speed + "倍速"); showUi(); };
    $("cfs").onclick = function (e) { e.stopPropagation(); if (isFull()) exitRot(); else fullscreen(); setTimeout(paintCtrl, 300); showUi(); };
    // 何もないところをタップ：操作が出ていれば隠す（再生中だけ）。隠れていれば video のタップで出す
    $("ctrl").addEventListener("click", function (e) {
      e.stopPropagation();
      if (e.target !== $("ctrl") && e.target !== $("ctitle")) return showUi();
      if (!video.paused) { clearTimeout(hideTimer); $("stage").classList.add("hide-ui"); } else showUi();
    });
    video.addEventListener("click", function () { if (started && !switched) showUi(); });
    $("stage").addEventListener("mousemove", function () { if (started && !switched && window.matchMedia("(pointer: fine)").matches) showUi(); });
    var bar = $("bar");
    bar.addEventListener("pointerdown", function (e) { dragging = true; try { bar.setPointerCapture(e.pointerId); } catch (x) {} seekFromPoint(e); showUi(); e.preventDefault(); });
    bar.addEventListener("pointermove", function (e) { if (dragging) seekFromPoint(e); });
    bar.addEventListener("pointerup", function () { dragging = false; showUi(); });
    bar.addEventListener("pointercancel", function () { dragging = false; });
    document.addEventListener("pointerup", function () { dragging = false; });
    document.addEventListener("touchend", function () { dragging = false; });
    ["play", "pause", "timeupdate", "progress", "durationchange", "loadedmetadata"].forEach(function (ev) { video.addEventListener(ev, paintCtrl); });
    video.addEventListener("play", function () { $("stage").classList.remove("hide-ui"); hideSoon(1500); });
    video.addEventListener("pause", function () {
      $("stage").classList.remove("hide-ui"); clearTimeout(hideTimer);
      cover.hidden = true; // 一時停止中は、真ん中の再生ボタンを含む操作をそのまま出す
    });
    video.addEventListener("waiting", function () { if (started && !switched) $("spin").hidden = false; });
    video.addEventListener("playing", function () { $("spin").hidden = true; });
    video.addEventListener("canplay", function () { $("spin").hidden = true; });
    video.addEventListener("ended", function () { $("stage").classList.remove("hide-ui"); });
    document.addEventListener("fullscreenchange", paintCtrl);
    // パソコン：スペースで再生・一時停止、←→で5秒戻る・進む
    document.addEventListener("keydown", function (e) {
      if (!started || switched || /INPUT|TEXTAREA/.test((e.target || {}).tagName || "")) return;
      if (e.key === " " || e.key === "k") { e.preventDefault(); togglePlay(); showUi(); }
      else if (e.key === "ArrowRight") { video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); showUi(); }
      else if (e.key === "ArrowLeft") { video.currentTime = Math.max(0, video.currentTime - 5); showUi(); }
    });
    paintCtrl();
    $("fs").onclick = fullscreen;
    $("exitfs").onclick = exitRot;
    // iPhone の動画の中の全画面ボタンは、アプリの中だと縦のまま固まることがある → ページの中の横向き表示に切り替える
    video.addEventListener("webkitbeginfullscreen", function () {
      setTimeout(function () {
        var playing = !video.paused;
        try { video.webkitExitFullscreen(); } catch (e) {}
        enterRot();
        if (playing) { var p = video.play(); if (p && p.catch) p.catch(function () {}); }
      }, 50);
    });
    // 横に向けたとき：画面いっぱいの表示は CSS が受け持つ。Android では本物の全画面も試す（だめでも表示は横いっぱいのまま）
    var landscape = window.matchMedia("(orientation: landscape) and (max-height: 540px) and (pointer: coarse)");
    var onTurn = function () {
      if (landscape.matches) {
        setTimeout(function () { window.scrollTo(0, 120); }, 300); // バーを縮める（効かない時は上にスワイプ）
        if (started && !switched && document.fullscreenEnabled && !document.fullscreenElement) {
          try { var r = $("stage").requestFullscreen(); if (r && r.catch) r.catch(function () {}); } catch (e) {}
        }
      } else {
        window.scrollTo(0, 0);
        if (document.fullscreenElement) { try { document.exitFullscreen().catch(function () {}); } catch (e) {} }
      }
    };
    if (landscape.addEventListener) landscape.addEventListener("change", onTurn); else if (landscape.addListener) landscape.addListener(onTurn);
    video.addEventListener("loadedmetadata", function () { setDur(video.duration); video.playbackRate = speed; });
    video.addEventListener("loadeddata", function () { $("wait").hidden = true; });
    video.addEventListener("play", function () { cover.hidden = true; poster.hidden = true; });
    video.addEventListener("playing", function () { clearTimeout(watchdog); $("wait").hidden = true; countView(); });
    fetch(VIEWS + "?id=" + id).then(function (r) { return r.json(); }).then(function (d) { if (d && d.viewers) showViews(d.viewers); }).catch(function () {});
    video.addEventListener("ratechange", function () { if (video.playbackRate !== speed && SPEEDS.indexOf(video.playbackRate) >= 0) setSpeed(video.playbackRate); });
    video.addEventListener("error", function () {
      if (switched) return;
      if (retries >= 40) return useDrivePlayer();
      // 録り終わった直後は、まだ1バイトの仮ファイルしか届いていないことがある → 待って読み直す。
      // それ以外（断られた・見つからない）は、すぐドライブの再生画面に切り替える。
      fetch(SRC + "&probe=" + Date.now(), { headers: { Range: "bytes=0-1" } })
        .then(function (r) { if (r.status !== 206 && r.status !== 200) throw new Error(String(r.status)); return r.arrayBuffer(); })
        .then(function (buf) { if (buf.byteLength < 2 || retries < 3) retryLater(); else useDrivePlayer(); })
        .catch(function () { useDrivePlayer(); });
    });
    // 題名・録った日時・長さ・サムネイル（ドライブの情報から）
    fetch(API + id + "?fields=name,createdTime,thumbnailLink,videoMediaMetadata&key=" + KEY)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (m) {
        if (!m) return;
        var base = String(m.name || "").replace(/\.mp4$/i, "");
        var t = base.replace(/^\d{4}-\d{2}-\d{2}_\d{4}(\(\d+\))?_?/, "").trim();
        if (!t) { var mm = base.match(/^(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})/); t = mm ? (Number(mm[2]) + "月" + Number(mm[3]) + "日 " + mm[4] + ":" + mm[5] + " の説明動画") : "説明動画"; }
        $("title").textContent = t; document.title = t;
        $("when").textContent = ago(m.createdTime);
        if (m.videoMediaMetadata && m.videoMediaMetadata.durationMillis && !video.duration) setDur(m.videoMediaMetadata.durationMillis / 1000);
        if (m.thumbnailLink && !started) {
          poster.onload = function () { if (!started) poster.hidden = false; };
          poster.src = m.thumbnailLink.replace(/=s\d+$/, "=s1280");
        }
      }).catch(function () {});
    // 要約と文字起こし（録ったあと少しして、自動でドライブに置かれる）
    function fmtTs(sec) { sec = Math.floor(sec || 0); var m = Math.floor(sec / 60), x = sec % 60; return m + ":" + (x < 10 ? "0" : "") + x; }
    function seek(sec) {
      if (switched) return;
      if (!started) { startAt = sec; begin(); return; }
      try { video.currentTime = sec; } catch (e) {}
      var p = video.play(); if (p && p.catch) p.catch(function () {});
    }
    var q = encodeURIComponent("'" + SIDE + "' in parents and name = '" + id + ".json' and trashed = false");
    fetch(API + "?q=" + q + "&fields=files(id)&key=" + KEY)
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (l) { if (l && l.files && l.files[0]) return fetch(API + l.files[0].id + "?alt=media&key=" + KEY); })
      .then(function (r) { return r && r.ok ? r.json() : null; })
      .then(function (t) {
        if (!t) return;
        if (t.title && /^説明動画$|の説明動画$/.test($("title").textContent)) { $("title").textContent = t.title; document.title = t.title; }
        if (t.summary) { $("sum").textContent = t.summary; $("sumSec").hidden = false; }
        var segs = t.segments || [];
        if (!segs.length) return;
        var box = $("tr");
        segs.forEach(function (sg, i) {
          var b = document.createElement("button");
          b.dataset.s = sg.start;
          b.innerHTML = '<span class="ts">' + fmtTs(sg.start) + "</span><span></span>";
          b.lastChild.textContent = sg.text;
          b.onclick = function () { seek(sg.start); };
          if (i >= 8) b.hidden = true;
          box.append(b);
        });
        $("trSec").hidden = false;
        if (segs.length > 8) {
          $("more").hidden = false;
          $("more").onclick = function () { [].forEach.call(box.children, function (b) { b.hidden = false; }); $("more").hidden = true; };
        }
        // 再生中の文に色を付ける
        video.addEventListener("timeupdate", function () {
          var cur = video.currentTime, now = null;
          [].forEach.call(box.children, function (b) { if (Number(b.dataset.s) <= cur) now = b; b.classList.remove("now"); });
          if (now) now.classList.add("now");
        });
      }).catch(function () {});
    if (navigator.share) {
      $("share").hidden = false;
      $("share").onclick = function () { navigator.share({ title: document.title, url: location.href }).catch(function () {}); };
    }
    $("copy").onclick = function () {
      var done = function () { toast("リンクをコピーしました"); };
      if (navigator.clipboard) navigator.clipboard.writeText(location.href).then(done, done); else done();
    };
  }
</script>
